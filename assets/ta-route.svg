      <rect x="875" width="150" height="105" rx="18" fill="#312e81"/><text x="893" y="31" fill="#c7d2fe" font-size="12" font-weight="800">05</text><text x="893" y="58" fill="#fff" font-size="20" font-weight="800">MAÎTRISE</text><text x="893" y="82" fill="#e0e7ff" font-size="13">preuve · transfert</text>
