      <rect x="350" width="150" height="105" rx="18" fill="#ede9fe"/><text x="368" y="31" fill="#6d28d9" font-size="12" font-weight="800">02</text><text x="368" y="58" fill="#0f172a" font-size="20" font-weight="800">CONSTRUCTION</text><text x="368" y="82" fill="#475569" font-size="13">système · code</text>
      <rect x="525" width="150" height="105" rx="18" fill="#f3e8ff"/><text x="543" y="31" fill="#7e22ce" font-size="12" font-weight="800">03</text><text x="543" y="58" fill="#0f172a" font-size="20" font-weight="800">PILOTAGE</text><text x="543" y="82" fill="#475569" font-size="13">risque · exécution</text>
