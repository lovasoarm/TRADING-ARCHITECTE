    <text x="55" y="84" fill="#475569" font-size="15">On ne saute pas directement à la stratégie : chaque palier fournit une nouvelle capacité.</text>
    <g transform="translate(55,115)">
      <rect width="150" height="105" rx="18" fill="#e2e8f0"/><text x="18" y="31" fill="#334155" font-size="12" font-weight="800">00</text><text x="18" y="58" fill="#0f172a" font-size="20" font-weight="800">SOCLE</text><text x="18" y="82" fill="#475569" font-size="13">langage · terrain</text>
