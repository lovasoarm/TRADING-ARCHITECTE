<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">La route Trading Architecte</title>
  <desc id="d">Six niveaux avec des livrables observables.</desc>
  <rect width="1200" height="300" rx="28" fill="#f8fafc"/>
  <g font-family="Inter,Arial,sans-serif">
